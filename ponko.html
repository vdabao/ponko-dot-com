<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="ponko.css">
    <script src="ponko.js"></script>
    <script>
        let categories = ["clipboard", "profiles", "communications", "sites"];
        let currentTab = "clipboard";
        let editMode = false;
        let removeMode = false;
        let data = {};

        function clearAll() {
            let current = selection.slice();
            for (let k = 0; k < current.length; k++) {
                clickFilter(current[k]);
            }
        }

        function showTab(tab) {
            if (selection.includes(tab)) {
                return;
            }
            clearAll();
            clickFilter(tab);
            currentTab = tab;
            editMode = false;
            removeMode = false;
            updateButtons()
        }

        function saveData() {
            localStorage.setItem("ponkoData", JSON.stringify(data));
        }

        function loadData() {
            let saved = localStorage.getItem("ponkoData");
            if (saved) {
                data = JSON.parse(saved);
            } else {
                let oldClips = localStorage.getItem("ponkoClips");
                data = {
                    clipboard: oldClips ? JSON.parse(oldClips) : [],
                    profiles: [
                        { name: "LinkedIn", text: "https://www.linkedin.com/in/vdabao" },
                        { name: "GitHub", text: "https://github.com/vdabao" },
                        { name: "JobStreet", text: "https://ph.jobstreet.com/profiles/318dfvv0ff" },
                        { name: "Facebook", text: "https://www.facebook.com/victoreanand/" }
                    ],
                    communications: [
                        { name: "Messenger", text: "https://www.facebook.com/messages/t" },
                        { name: "Private Email", text: "https://mail.google.com/mail/u/0/#inbox" },
                        { name: "Public Email", text: "https://mail.google.com/mail/u/1/#inbox" },
                        { name: "UP Email", text: "https://mail.google.com/mail/u/2/#inbox" },
                        { name: "UP Alumni Email", text: "https://mail.google.com/mail/u/3/#inbox" },
                        { name: "EEE Email", text: "https://mail.google.com/mail/u/4/#inbox" }
                    ],
                    sites: []                    
                };
            }
            for (let c = 0; c < categories.length; c++) {
                for (let k = 0; k < data[categories[c]].length; k++) {
                    makeItem(categories[c], k);
                }
            }
        }

        function makeItem(tab, index) {
            let div = document.createElement("div");
            div.className = "item " + tab;
            if (selection.includes(tab)) {
                div.className += " show";
            }
            div.dataset.tab = tab;
            div.dataset.index = index;
            div.innerText = data[tab][index].name;
            div.onclick = function () { itemClick(div); };
            document.querySelector(".item-container").appendChild(div);
        }

        function itemClick(element) {
            let tab = element.dataset.tab;
            let item = data[tab][element.dataset.index];
            if (editMode) {
                editItem(element);
            } else if (removeMode) {
                removeItem(element);
            } else if (tab == "clipboard") {
                navigator.clipboard.writeText(item.text);
                element.innerText = "Copied!";
                setTimeout(function () { element.innerText = item.name; }, 800);
            } else {
                window.open(item.text, '_blank');
            }
        }

        function fixLink(text) {
            text = text.trim();
            if (text != "" && !text.includes("://")) {
                text = "https://" + text;
            }
            return text;
        }

        function addItem() {
            let tab = currentTab;
            let name = prompt("Name of the new item:");
            if (name == null || name.trim() == "") {
                return;
            }
            let text;
            if (tab == "clipboard") {
                text = prompt("Text to copy when clicked:");
            } else {
                text = prompt("Link to open when clicked:");
                if (text != null) {
                    text = fixLink(text);
                }
            }
            if (text == null || (tab != "clipboard" && text == "")) {
                return;
            }
            data[tab].push({ name: name.trim(), text: text });
            saveData();
            makeItem(tab, data[tab].length - 1);
        }

        function editItem(element) {
            let tab = element.dataset.tab;
            let item = data[tab][element.dataset.index];
            let name = prompt("Edit name:", item.name);
            if (name == null || name.trim() == "") {
                return;
            }
            let text;
            if (tab == "clipboard") {
                text = prompt("Edit text to copy:", item.text);
            } else {
                text = prompt("Edit link:", item.text);
                if (text != null) {
                    text = fixLink(text);
                }
            }
            if (text == null || (tab != "clipboard" && text == "")) {
                return;
            }
            item.name = name.trim();
            item.text = text;
            saveData();
            element.innerText = item.name;
        }

        function updateButtons() {
            let editButton = document.getElementById("button-edit");
            let removeButton = document.getElementById("button-remove");
            if (editMode) {
                if (!editButton.className.includes(" selected")) {
                    editButton.className += " selected";
                }
            } else {
                editButton.className = editButton.className.replace(" selected", "");
            }
            if (removeMode) {
                if (!removeButton.className.includes(" selected")) {
                    removeButton.className += " selected";
                }
            } else {
                removeButton.className = removeButton.className.replace(" selected", "");
            }
        }

        function toggleEditButton() {
            editMode = !editMode;
            if (editMode == true) {
                removeMode = false;
            }
            updateButtons();
        }

        function toggleRemoveButton() {
            removeMode = !removeMode;
            if (removeMode == true) {
                editMode = false;
            }
            updateButtons();
        }

        function removeItem(element) {
            let tab = element.dataset.tab;
            let index = parseInt(element.dataset.index);
            if (!confirm("Are you sure you want to delete this item?")) {
                return;
            }
            data[tab].splice(index, 1);
            saveData();
            element.remove();
        }

        window.onload = function () {
            loadData();
            showTab("clipboard");
        };
    </script>
</head>

<body>
    <div class="main-wrapper">
        <div>
            <br>
            <h1 style="font-family:Google Sans Code;text-align:center;">ponko dot com</h1>
            <hr>
            <img src="assets/images/Ponko_GIF_Transparent.gif" alt="Ponko GIF" class="center">
            <h6 id="demo1" style="font-family:Google Sans Code;text-align:center;">Art: Keita Yatera</h6>
            <hr>
            <h2 id="demo2" style="font-family:Google Sans Code;text-align:center;">Personal Directory</h2>
            <h2 id="demo3" style="font-family:Google Sans Code;text-align:center;">[vdabao]</h2>
        </div>
        <div class="section">
            <div class="section-row">
                <div class="row-container">
                    <div class="container-label">Category</div>
                    <label id="clipboard" class="container-option-filter">
                        <input type="button" onclick="showTab('clipboard')">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/clipboard.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                    <label id="profiles" class="container-option-filter">
                        <input type="button" onclick="showTab('profiles')">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/person.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                    <label id="communications" class="container-option-filter">
                        <input type="button" onclick="showTab('communications')">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/envelope.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                    <label id="sites" class="container-option-filter">
                        <input type="button" onclick="showTab('sites')">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/globe.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                </div>
                <div class="row-container">
                    <div class="container-label">Actions</div>
                    <label id="button-add" class="container-option-filter">
                        <input type="button" onclick="addItem()">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/feather.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                    <label id="button-edit" class="container-option-filter">
                        <input type="button" onclick="toggleEditButton()">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/pencil-square.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                    <label id="button-remove" class="container-option-filter">
                        <input type="button" onclick="toggleRemoveButton()">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/trash.svg" alt="" width="18" height="18" style="filter:invert(1)">
                    </label>
                </div>
            </div>
        </div>
        <div class="section">
            <div class="section-row">
                <div class="item-container">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
